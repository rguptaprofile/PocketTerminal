services:
  - type: web
    name: pocketterminal-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 -b 0.0.0.0:$PORT --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: POCKET_ENV
        value: production
      - key: POCKET_SSL
        value: "0"
      - key: POCKET_ENABLE_ML
        value: "0"
      - key: POCKET_ALLOWED_ORIGINS
        value: https://pocket-terminal.vercel.app,https://pocketterminal.netlify.app
