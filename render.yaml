services:
  - type: web
    name: pocketterminal-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: POCKET_ENABLE_ML
        value: "0"
      - key: POCKET_SSL
        value: "0"
